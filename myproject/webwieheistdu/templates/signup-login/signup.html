<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }


      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f5f5;
      }


      .container {
        background: white;
        padding: 25px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        width: 350px;
        text-align: center;
      }


      h2 {
        margin-bottom: 15px;
        color: #333;
      }


      .form-group {
        text-align: left;
        margin-bottom: 10px;
      }


      label {
        font-weight: bold;
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
        color: #555;
      }


      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        transition: 0.3s;
      }


      input:focus {
        border-color: #df4710;
        outline: none;
        box-shadow: 0 0 5px rgba(223, 71, 16, 0.3);
      }


      button {
        width: 100%;
        padding: 12px;
        background: #df4710;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
      }


      button:hover {
        background: #c63d0f;
      }


      .errorlist {
        color: red;
        font-size: 14px;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Đăng ký tài khoản</h2>
      <form method="POST">
        {% csrf_token %}


        <div class="form-group">
          <label for="id_name">Họ và Tên:</label>
          {{ form.name }}
        </div>


        <div class="form-group">
          <label for="id_email">Email:</label>
          {{ form.email }}
        </div>


        <div class="form-group">
          <label for="id_password">Mật khẩu:</label>
          {{ form.password }}
        </div>


        <div class="form-group">
          <label for="id_phone">Số điện thoại:</label>
          {{ form.phone }}
        </div>


        <button type="submit">Đăng ký</button>
      </form>
    </div>
  </body>
</html>
