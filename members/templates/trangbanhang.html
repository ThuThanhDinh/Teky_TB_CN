{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Store</title>
  <link rel="stylesheet" href="{% static 'trangbanhang.css' %}">
</head>
<body>
  <!-- Header Section -->
  <header class="header">
    <div class="container">
      <h1 class="logo">MyStore</h1>
      <nav>
        <ul class="menu">
          <li><a href="#">Home</a></li>
          <li><a href="#">Shop</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#" class="cart">Cart</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h2>Welcome to MyStore</h2>
      <p>Find the best products at unbeatable prices</p>
      <button class="shop-now">Shop Now</button>
    </div>
  </section>

  <!-- Products Section -->
  <section class="products">
    <div class="container">
      <h3 class="section-title">Our Products</h3>
      <div class="product-list">
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Product 1">
          <h4>Product 1</h4>
          <p>$19.99</p>
          <button>Add to Cart</button>
        </div>
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Product 2">
          <h4>Product 2</h4>
          <p>$29.99</p>
          <button>Add to Cart</button>
        </div>
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Product 3">
          <h4>Product 3</h4>
          <p>$39.99</p>
          <button>Add to Cart</button>
        </div>
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Product 4">
          <h4>Product 4</h4>
          <p>$49.99</p>
          <button>Add to Cart</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer Section -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 MyStore. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
