<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopee Menu Bar</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .navbar-custom {
        background: linear-gradient(to right, #f53d2d, #ff7337);
        padding: 8px 20px;
      }
      .navbar-custom .nav-link,
      .navbar-custom .navbar-brand {
        color: white;
        font-size: 14px;
      }
      .navbar-custom .nav-link:hover {
        text-decoration: underline;
      }
      .btn-link, .btn-link:hover, .btn-link:focus {
        text-decoration: none !important;
      }
      .search-bar {
        max-width: 600px;
        width: 100%;
      }
      .search-input {
        border-radius: 0;
      }
      .cart-icon {
        color: white;
        font-size: 22px;
        margin-left: 15px;
      }
      .body {
        padding: 50px;
      }
    </style>
  </head>
  <body>
    <!-- Thanh menu -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="{% url 'store' %}">
          <img
            src="https://cdn.iconscout.com/icon/free/png-256/shopee-2296050-1912020.png"
            alt="Shopee"
            width="30"
            class="me-1"
          />
          Shopee
        </a>

        <!-- Tìm kiếm -->
        <form class="d-flex mx-auto search-bar">
          <input
            class="form-control search-input"
            type="search"
            placeholder="Shopee bao ship 0Đ - Đăng ký ngay!"
            aria-label="Search"
          />
          <button class="btn btn-light" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>

        <!-- Icon giỏ hàng -->
        <a href="{% url 'cart' %}" class="cart-icon">
          <i class="bi bi-cart3"></i>
        </a>

        <!-- Đăng nhập/Tên người dùng -->
        {% if user.is_authenticated %}
          <div class="dropdown ms-3">
            <button class="btn btn-link text-white dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="#">Hồ sơ</a></li>
              <li><a class="dropdown-item" href="{% url 'cart' %}">Giỏ hàng</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="{% url 'logout' %}">Đăng xuất</a></li>
            </ul>
          </div>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light ms-3">
            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
          </a>
        {% endif %}
      </div>
    </nav>
    <div class="body">
      <!-- Messages -->
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      <!-- Nội dung chính -->
      {% block content %} {% endblock %}
    </div>

    <!-- Bootstrap JS + Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </body>
</html>
