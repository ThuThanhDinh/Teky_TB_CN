{% extends 'base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card p-4" style="width: 400px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h4 class="mb-3 text-center">Đăng nhập</h4>
        <div class="mb-3 d-flex justify-content-end">
            <button class="btn btn-outline-warning btn-sm" style="border-radius: 20px;">Đăng nhập với mã QR</button>
            <span class="ms-2" style="font-size: 22px; color: #ff5722;">&#128273;</span>
        </div>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="Email/Số điện thoại/Tên đăng nhập" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Mật khẩu" required>
            </div>
            <button type="submit" class="btn w-100" style="background: #ff5722; color: #fff;">ĐĂNG NHẬP</button>
        </form>
        <div class="mt-2 text-end">
            <a href="#" class="text-decoration-none">Quên mật khẩu</a>
        </div>
        <div class="my-3 text-center">
            <span>HOẶC</span>
        </div>
        <div class="d-flex justify-content-between">
            <a href="#" class="btn btn-outline-primary w-50 me-2"><i class="bi bi-facebook"></i> Facebook</a>
            <a href="#" class="btn btn-outline-danger w-50"><i class="bi bi-google"></i> Google</a>
        </div>
        <div class="mt-3 text-center">
            <span>Bạn mới biết đến Shopee? <a href="#" class="text-danger">Đăng ký</a></span>
        </div>
    </div>
</div>
{% endblock %}
