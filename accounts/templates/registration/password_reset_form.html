{% extends 'news/base.html' %}
{% block title %}Forgot your password?{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 40px auto;">
    <h1 style="font-size: 2.2rem; font-weight: bold; margin-bottom: 0.5em;">Forgot your password?</h1>
    <p style="margin-bottom: 1.5em; color: #444;">Enter your email address below, and we'll email instructions for setting a new one.</p>
    <form method="post" style="margin-bottom: 1em;">
        {% csrf_token %}
        <div style="margin-bottom: 1em;">
            <label for="id_email" style="font-weight: 500;">Email:</label>
            <input type="email" name="email" id="id_email" class="form-control" style="width: 300px; display: inline-block; margin-left: 10px;" required>
        </div>
        <button type="submit" class="btn btn-success">Send me instructions!</button>
    </form>
</div>
{% endblock %}
